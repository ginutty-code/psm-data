name: Add issue to PSM project

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/ginutty-code/projects/4
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
